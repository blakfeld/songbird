name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: songbird
          POSTGRES_PASSWORD: songbird
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songbird"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      # Reads backend/rust-toolchain.toml so CI uses the pinned version.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: backend

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - run: just lint-backend
      - run: just test-backend
      # The default pass above ran database-backed tests on SQLite; this one reruns them on Postgres.
      - run: just test-backend-pg

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: just lint-frontend
      - run: just test-frontend

  # Playwright boots the real backend with cargo, so this job needs both toolchains.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      # Reads backend/rust-toolchain.toml so CI uses the pinned version.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: backend

      # A separate key keeps this job's api-only build from overwriting the backend job's full workspace cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: e2e

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies and Playwright browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - run: just test-e2e

  # Gated on every check so a merge that breaks main never ships.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    # FLY_API_TOKEN is a secret of this environment, so the job can't read it without naming it.
    environment: production
    # Two merges in quick succession would otherwise deploy over each other; queue them instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # setup.sh provisions whatever is missing, deploys with --ha=false, and checks the result.
      # Calling fly deploy separately would roll out a second release and skip those checks.
      - run: deploy/setup.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
